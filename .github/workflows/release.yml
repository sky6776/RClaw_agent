# =============================================================================
# 仅打 tag 推送（v* 版本 tag）时构建三种产物并发布到 GitHub Release；
# 普通推送 main 不再触发（需要产物时打版本 tag，或手动 workflow_dispatch）。
#   1. RClaw-android-arm64.apk        安卓 arm64 安装包（debug/release 签名自适应）
#   2. RClaw-desktop-portable-win64.zip  Windows 桌面免安装版（解压即用）
#   3. RClaw-termux-aarch64.zip       Termux 用的 aarch64 二进制（release-termux profile）
#
# 步骤完全对齐本机构建脚本（build-android-apk.bat / build-windows.cmd）：
#   - 前端 ui/dist 必须先于 cargo 构建（tauri 编译期内嵌前端资源）；
#   - APK：cargo ndk 出单 .so → whisper JNI 库 → gradle -x rustBuild（.so 已就位）；
#     tauri.settings.gradle / tauri.properties 由 tauri-build 在 cargo 步骤生成
#     （需 TAURI_ANDROID_PROJECT_PATH），因此 cargo 步骤必须先于 gradle。
#   - 签名：仓库 secrets 配置 RCLAW_KEYSTORE_BASE64 + RCLAW_KEYSTORE_PASSWORD 时
#     自动启用 release 签名（keystore 解码到 gen/android/app/rclaw-release.keystore，
#     alias rclaw）；未配置时 gradle 自动回退 debug 签名（可直接安装，与本地行为一致）。
# =============================================================================

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # 版本一致性门禁：tag `vX.Y.Z` 必须同时等于两处应用版本——
  #   · crates/rclaw-desktop/tauri.conf.json 的 version（桌面 package_info / 更新检查）；
  #   · crates/rclaw-desktop/gen/android/app/tauri.properties 的 tauri.androidName
  #     （已入库；gradle 的 APK versionName 与 build.rs 注入的 RCLAW_APP_VERSION
  #     「关于」版本都读它）。
  # 只改其中一处打 tag 会出现 Release 页写着 v1.2.3、装上去「关于」显示 1.2.2，升级安装
  # 还可能因 versionCode 不增而被拒。手动 dispatch（nightly）不受此门禁。
  # ---------------------------------------------------------------------------
  version-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match app versions (tauri.conf.json + tauri.properties)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          APP_VERSION="$(jq -r .version crates/rclaw-desktop/tauri.conf.json)"
          ANDROID_VERSION="$(sed -n 's/^tauri\.androidName=//p' crates/rclaw-desktop/gen/android/app/tauri.properties | tr -d '[:space:]')"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$TAG_VERSION" != "$APP_VERSION" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} 与 crates/rclaw-desktop/tauri.conf.json 的 version=${APP_VERSION} 不一致：先把 version 改成 ${TAG_VERSION}（或重新打 v${APP_VERSION} 的 tag）再发布"
            exit 1
          fi
          if [ "$TAG_VERSION" != "$ANDROID_VERSION" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} 与 crates/rclaw-desktop/gen/android/app/tauri.properties 的 tauri.androidName=${ANDROID_VERSION} 不一致：APK versionName / 「关于」版本读的是它，改成 ${TAG_VERSION} 后再发布"
            exit 1
          fi
          echo "版本一致：${GITHUB_REF_NAME} == tauri.conf.json ${APP_VERSION} == tauri.properties ${ANDROID_VERSION}"

  # ---------------------------------------------------------------------------
  # 桌面免安装版（Windows）：前端 → cargo release → exe 打 zip
  # ---------------------------------------------------------------------------
  desktop:
    needs: [version-check]
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build frontend (ui/dist)
        working-directory: crates/rclaw-desktop/ui
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Build desktop binary
        run: cargo build --release -p rclaw-desktop

      - name: Package portable exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\release\rclaw-desktop.exe dist\RClaw-desktop-win64.exe
          @'
          RClaw 桌面版（Windows 单文件，免安装）

          使用：下载 RClaw-desktop-win64.exe 后直接双击运行（应用内「关于 → 检查更新」
          可自动下载替换升级）。
            - 需要 WebView2 Runtime（Windows 10/11 通常已内置）。
            - 用户数据目录：%USERPROFILE%\.rclaw（rclaw.toml 与 agent/ 工作区）。
            - 关闭窗口 = 隐藏到托盘；托盘菜单「退出」才结束进程。
          '@ | Set-Content -Path dist\README-win64.txt -Encoding utf8

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-portable
          path: dist/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Termux 二进制（ubuntu 交叉编译 aarch64-linux-android，release-termux profile）
  # 用 cargo-ndk：除 linker 外还需它导出的目标 C 编译器环境变量（ring 等 C 依赖）
  # ---------------------------------------------------------------------------
  termux:
    needs: [version-check]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      # sdkmanager 是 Java 程序：先确保 JDK 17。
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # runner 镜像已不自带 Android SDK（首跑 sdkmanager exit 127）：setup-android@v4
      # 自装 cmdline-tools + 接受 licenses + 设 ANDROID_HOME（v3 因 Google 下线 tools 包
      # 损坏，v4 起修复）。
      - uses: android-actions/setup-android@v4

      - name: Install NDK
        run: |
          sdkmanager --install "ndk;29.0.14206865" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"

      # rquickjs-sys 的安卓 bindings 需构建期现场生成（runtime 对 android 目标开了
      # rquickjs/bindgen）：bindgen 跑在宿主上要 libclang，解析 quickjs.h 的系统头
      # （stdio/stdint…）还得指到 NDK sysroot，否则 --target=aarch64-linux-android
      # 找不到 libc 头文件。
      - name: Configure bindgen for android bindings (rquickjs-sys)
        run: |
          sudo apt-get install -y libclang-dev
          echo "BINDGEN_EXTRA_CLANG_ARGS=--sysroot=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot" >> "$GITHUB_ENV"

      - name: Build rclaw (release-termux profile)
        run: cargo ndk -t arm64-v8a build --profile release-termux -p rclaw-cli

      - name: Package termux zip
        run: |
          mkdir -p dist/pkg
          cp target/aarch64-linux-android/release-termux/rclaw dist/pkg/
          cp rclaw.toml.example dist/pkg/
          cat > dist/pkg/README.txt <<'EOF'
          RClaw Termux 版（aarch64）

          使用：解压后在 Termux 里
            pkg install python            # 技能脚本依赖
            cp rclaw.toml.example rclaw.toml   # 填入 api_key
            chmod +x rclaw && ./rclaw
          EOF
          command -v zip >/dev/null || sudo apt-get install -y zip
          (cd dist/pkg && zip -qr ../RClaw-termux-aarch64.zip .)
          rm -rf dist/pkg

      - uses: actions/upload-artifact@v4
        with:
          name: termux-aarch64
          path: dist/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 安卓 APK（ubuntu）：前端 → cargo ndk .so → whisper JNI 库 → gradle release
  # ---------------------------------------------------------------------------
  apk:
    needs: [version-check]
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      WRY_ANDROID_PACKAGE: ai.rclaw.app
      TAURI_ANDROID_PACKAGE_UNESCAPED: ai.rclaw.app
      WRY_ANDROID_LIBRARY: rclaw_desktop
      RCLAW_KEYSTORE_PASSWORD: ${{ secrets.RCLAW_KEYSTORE_PASSWORD }}
      # Ubuntu 24+ 的 PEP 668 externally-managed 环境会拒绝 pip 装包；
      # Chaquopy 的 buildPython 经 pip 解析依赖，CI 里放开该限制。
      PIP_BREAK_SYSTEM_PACKAGES: "1"
      ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      # runner 镜像已不自带 Android SDK（首跑 sdkmanager exit 127）：setup-android@v4
      # 自装 cmdline-tools + 接受 licenses + 设 ANDROID_HOME（v3 因 Google 下线 tools 包
      # 损坏，v4 起修复）。
      - uses: android-actions/setup-android@v4

      - name: Install SDK components (NDK / platform / build-tools)
        run: |
          # Chaquopy buildPython：minimal 镜像可能缺 pip
          command -v python3 >/dev/null 2>&1 || sudo apt-get install -y python3
          python3 -m pip --version >/dev/null 2>&1 || sudo apt-get install -y python3-pip
          sdkmanager --install "ndk;29.0.14206865" "platforms;android-36" \
            "build-tools;36.0.0" "platform-tools" > /dev/null
          {
            echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865"
            echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865"
            echo "NDK_ROOT=$ANDROID_HOME/ndk/29.0.14206865"
            # tauri-build 据此生成 tauri.settings.gradle / tauri.properties
            echo "TAURI_ANDROID_PROJECT_PATH=$GITHUB_WORKSPACE/crates/rclaw-desktop/gen/android"
            echo "WRY_ANDROID_KOTLIN_FILES_OUT_DIR=$GITHUB_WORKSPACE/crates/rclaw-desktop/gen/android/app/src/main/java/ai/rclaw/app/generated"
            echo "RCLAW_BUILD_PYTHON=python3"
          } >> "$GITHUB_ENV"
          # wry 的 build.rs 会对 WRY_ANDROID_KOTLIN_FILES_OUT_DIR 做 canonicalize，
          # 目录不存在直接 panic；该目录由构建生成、不入库，新克隆需预建。
          mkdir -p crates/rclaw-desktop/gen/android/app/src/main/java/ai/rclaw/app/generated

      # 同 termux job：runtime 对 android 目标开 rquickjs/bindgen，宿主要 libclang、
      # bindgen 解析系统头要指到 NDK sysroot。
      - name: Configure bindgen for android bindings (rquickjs-sys)
        run: |
          sudo apt-get install -y libclang-dev
          echo "BINDGEN_EXTRA_CLANG_ARGS=--sysroot=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot" >> "$GITHUB_ENV"

      - name: Build frontend (ui/dist)
        working-directory: crates/rclaw-desktop/ui
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Rust single .so (librclaw_desktop.so, aarch64, apk-host)
        env:
          # 全局 CARGO_TERM_COLOR=always 会让 error 行带 ANSI 码，害得诊断 grep 落空；
          # 此步骤用纯文本输出，失败时 error 行才能被注释步骤按行首 ^error 命中。
          CARGO_TERM_COLOR: never
        run: |
          set -o pipefail
          cargo ndk -t arm64-v8a build -p rclaw-desktop --features apk-host,tauri/custom-protocol --release 2>&1 | tee ndk_build.log

      # 失败时把 cargo 的 error 行转成 check-run annotations（API 可读，便于远程诊断）
      - name: Surface cargo errors as annotations
        if: failure()
        run: |
          grep -aE "^error" ndk_build.log | head -25 | while IFS= read -r line; do echo "::error::$line"; done
          tail -40 ndk_build.log > ndk_tail.txt || true

      - name: Copy .so to jniLibs
        run: |
          JNI_DIR=crates/rclaw-desktop/gen/android/app/src/main/jniLibs/arm64-v8a
          mkdir -p "$JNI_DIR"
          cp target/aarch64-linux-android/release/librclaw_desktop.so "$JNI_DIR/"

      - name: Build whisper JNI lib (librclaw_whisper.so)
        run: |
          command -v cmake >/dev/null || sudo apt-get install -y cmake
          command -v ninja >/dev/null || sudo apt-get install -y ninja-build
          JNI_DIR=crates/rclaw-desktop/gen/android/app/src/main/jniLibs/arm64-v8a
          if [ ! -f "$JNI_DIR/librclaw_whisper.so" ]; then
            [ -d third_party/whisper.cpp/.git ] || \
              git clone --depth 1 https://github.com/ggml-org/whisper.cpp third_party/whisper.cpp
            cmake -S third_party/whisper-jni -B build-whisper/arm64 -G Ninja \
              -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 -DCMAKE_BUILD_TYPE=Release
            cmake --build build-whisper/arm64 --parallel
            mkdir -p "$JNI_DIR"
            cp build-whisper/arm64/librclaw_whisper.so "$JNI_DIR/"
          fi

      - name: Download bundled whisper model (ggml-base-q5_1.bin)
        run: |
          MODEL_DIR=crates/rclaw-desktop/gen/android/app/src/main/assets/models
          MODEL_FILE="$MODEL_DIR/ggml-base-q5_1.bin"
          if [ ! -f "$MODEL_FILE" ]; then
            mkdir -p "$MODEL_DIR"
            curl -fL --retry 2 -o "$MODEL_FILE" \
              "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base-q5_1.bin" \
            || curl -fL --retry 2 -o "$MODEL_FILE" \
              "https://hf-mirror.com/ggerganov/whisper.cpp/resolve/main/ggml-base-q5_1.bin"
          fi

      - name: Restore release keystore from secrets (optional)
        run: |
          if [ -n "$RCLAW_KEYSTORE_BASE64" ] && [ -n "$RCLAW_KEYSTORE_PASSWORD" ]; then
            echo "$RCLAW_KEYSTORE_BASE64" | base64 -d \
              > crates/rclaw-desktop/gen/android/app/rclaw-release.keystore
            echo "release 签名：已从 secrets 恢复 keystore"
          else
            echo "::notice::未配置 RCLAW_KEYSTORE_BASE64 / RCLAW_KEYSTORE_PASSWORD secrets，release APK 回退 debug 签名（可直接安装）"
          fi
        env:
          RCLAW_KEYSTORE_BASE64: ${{ secrets.RCLAW_KEYSTORE_BASE64 }}

      # 用仓库 secrets 里的 debug keystore 替换 runner 现场生成的：与手机上已装的
      # 本机构建包同签名，CI 包才能直接覆盖安装（否则签名不一致只能卸载重装）。
      # gradle 的 debug 签名（含 release 无 keystore 时的回退）读 ~/.android/debug.keystore。
      - name: Restore debug signing key (match device-installed signature)
        if: env.ANDROID_DEBUG_KEYSTORE_BASE64 != ''
        run: |
          mkdir -p "$HOME/.android"
          echo "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 -d > "$HOME/.android/debug.keystore"
          echo "debug 签名：已恢复仓库 secrets 中的 debug.keystore"

      - name: Gradle assembleArm64Release (skip rustBuild, .so already in place)
        working-directory: crates/rclaw-desktop/gen/android
        run: |
          chmod +x gradlew
          ./gradlew assembleArm64Release --no-daemon --no-configuration-cache \
            -x rustBuildArm64Release -Dkotlin.compiler.execution.strategy=in-process \
            -PabiList=arm64-v8a -ParchList=arm64 -PtargetList=aarch64

      # R8 看不到 Rust 侧的 JNI 调用点：proguard-rules.pro 的 keep 规则一旦缺失/
      # 失效，NativeBridge/PythonRuntime 的方法会被剥离或改名，运行期统一表现为
      # 「调用 NativeBridge.xxx 失败: Java exception was thrown」（v2.7.1 实证：
      # 应用内更新拉起安装器失败即此，runScript 同样被改名致 skill 脚本全坏）。
      # 方法名字符串只来自定义侧（dex 内无调用点），grep 命中即证明未被剥离。
      - name: Verify JNI bridge survived R8
        run: |
          APK=crates/rclaw-desktop/gen/android/app/build/outputs/apk/arm64/release/app-arm64-release.apk
          for method in installUpdate runScript openUrl updateRuntimeStatus; do
            unzip -p "$APK" classes.dex | grep -aq "$method" || {
              echo "::error::R8 剥离/改了 JNI 桥方法 $method（proguard-rules.pro 的 keep 规则失效？）"
              exit 1
            }
          done
          echo "JNI 桥方法校验通过（NativeBridge/PythonRuntime 未被 R8 破坏）"

      - name: Collect APK
        run: |
          mkdir -p dist
          cp crates/rclaw-desktop/gen/android/app/build/outputs/apk/arm64/release/app-arm64-release.apk \
            dist/RClaw-android-arm64.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 汇总发布：tag 触发 → 以 tag 名发布（正式版）；手动 dispatch → rolling
  # nightly（删除重建，保持旧行为兜底）。
  # ---------------------------------------------------------------------------
  release:
    needs: [desktop, termux, apk]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          STAMP="$(date -u +%Y-%m-%d)"
          # tag 推送（refs/tags/v*）用 tag 名发布；手动触发（分支 ref）回退 nightly。
          case "$GITHUB_REF" in
            refs/tags/*) TAG="$GITHUB_REF_NAME"; TITLE="RClaw $TAG ($SHORT_SHA)" ;;
            *)            TAG="nightly";        TITLE="RClaw Nightly $STAMP $SHORT_SHA" ;;
          esac
          cat > notes.md <<EOF
          构建于 \`$SHORT_SHA\`（$STAMP UTC，${TAG}）。

          | 产物 | 说明 |
          |---|---|
          | \`RClaw-android-arm64.apk\` | 安卓 arm64 安装包（Chaquopy Python + whisper 内置） |
          | \`RClaw-desktop-win64.exe\` | Windows 桌面单文件（免安装，双击运行；应用内可自动更新） |
          | \`RClaw-termux-aarch64.zip\` | Termux aarch64 二进制（release-termux profile 构建） |

          APK 签名：仓库配置了 \`RCLAW_KEYSTORE_BASE64\` + \`RCLAW_KEYSTORE_PASSWORD\`
          secrets 时为 release 签名；未配置时为 debug 签名（可直接安装，升级安装需同签名）。
          EOF
          # rolling nightly 删除重建；正式 tag 重跑只删 release 本体——版本 tag 指向的
          # 提交必须原样保留（--cleanup-tag 会把 tag 一并删掉，gh release create 随后
          # 在默认分支 HEAD 上重建它，tag / 源码包从此对不上产物）。
          if [ "$TAG" = "nightly" ]; then
            gh release delete nightly --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
          elif gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --repo "$GITHUB_REPOSITORY" || true
          fi
          if ! gh release create "$TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" \
              --notes-file notes.md \
              --target "$GITHUB_SHA" \
              $( [ "$TAG" = "nightly" ] && echo --prerelease ) 2> gh_err.txt; then
            grep -a . gh_err.txt | head -10 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
