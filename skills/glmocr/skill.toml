manifest_version = 1

[skill]
name = "glmocr"

[[entrypoints]]
name = "extract-text"
description = "使用 GLM-OCR 从一份本地图片、PDF 或远程文件中提取正文、表格、公式、手写内容和版面信息。"
runtime = "python"
script = "scripts/glm_ocr_cli.py"
timeout_ms = 1500000

[entrypoints.constraints]
exactly_one = [["file", "file_url"]]

[[entrypoints.arguments]]
name = "file"
type = "path"
description = "本地图片或 PDF 文件。"
flag = "--file"
must_exist = true

[[entrypoints.arguments]]
name = "file_url"
type = "string"
description = "远程图片或 PDF 的 HTTPS 地址。"
flag = "--file-url"

[[entrypoints.arguments]]
name = "output"
type = "path"
description = "可选的 JSON 结果文件。"
flag = "--output"

[[entrypoints.arguments]]
name = "pretty"
type = "boolean"
description = "格式化 JSON 输出。"
flag = "--pretty"

[[entrypoints.arguments]]
name = "include_raw"
type = "boolean"
description = "仅调试时附带完整上游响应；默认关闭。"
flag = "--include-raw"

[[entrypoints.arguments]]
name = "start_page"
type = "integer"
description = "PDF 起始页，从 1 开始。"
flag = "--start-page"
minimum = 1

[[entrypoints.arguments]]
name = "end_page"
type = "integer"
description = "PDF 结束页，从 1 开始。"
flag = "--end-page"
minimum = 1
