manifest_version = 1

[skill]
name = "happyhorse-t2v"

[[entrypoints]]
name = "generate-video"
description = "调用阿里云百炼 HappyHorse-1.1-T2V 文生视频模型：提交异步生成任务，轮询到完成后把 MP4 视频下载到指定路径。耗时通常 1-5 分钟。"
runtime = "python"
script = "scripts/happyhorse_t2v_cli.py"
timeout_ms = 1800000

[[entrypoints.arguments]]
name = "prompt"
type = "string"
description = "完整、具体且不含密钥的视频内容描述提示词，任意语言，中文上限 2500 字符。"
required = true
flag = "--prompt"

[[entrypoints.arguments]]
name = "save"
type = "path"
description = "生成的视频保存路径（workspace 内相对路径）；脚本会把扩展名规范化为 .mp4。"
required = true
flag = "--save"

[[entrypoints.arguments]]
name = "resolution"
type = "enum"
values = ["480P", "720P", "1080P"]
description = "视频分辨率档位；省略时使用配置文件默认值。计费为 480P 0.45 元/秒、720P 0.9 元/秒、1080P 1.2 元/秒。"
flag = "--resolution"

[[entrypoints.arguments]]
name = "ratio"
type = "enum"
values = ["16:9", "9:16", "1:1", "4:3", "3:4", "4:5", "5:4", "9:21", "21:9"]
description = "画面比例；省略时使用配置文件默认值。"
flag = "--ratio"

[[entrypoints.arguments]]
name = "duration"
type = "integer"
minimum = 3
maximum = 15
description = "视频时长秒数，3-15；省略时使用配置文件默认值。"
flag = "--duration"

[[entrypoints.arguments]]
name = "watermark"
type = "boolean"
description = "传入 true 在视频右下角添加 \"Happy Horse\" 水印；省略时使用配置文件默认值（当前为不加）。"
flag = "--watermark"

[[entrypoints.arguments]]
name = "seed"
type = "integer"
minimum = 0
maximum = 2147483647
description = "随机种子；固定种子可提升多次生成的可复现性。省略时由服务端随机。"
flag = "--seed"
