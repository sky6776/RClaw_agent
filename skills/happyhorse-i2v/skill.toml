manifest_version = 1

[skill]
name = "happyhorse-i2v"

[[entrypoints]]
name = "generate-video"
description = "调用阿里云百炼 HappyHorse-1.1-I2V 图生视频模型：以一张首帧图片为起点生成视频，提交异步任务，轮询到完成后把 MP4 下载到指定路径。耗时通常 1-5 分钟。输出画幅自动跟随首帧图片。"
runtime = "python"
script = "scripts/happyhorse_i2v_cli.py"
timeout_ms = 1800000

[[entrypoints.arguments]]
name = "image"
type = "url_or_path"
description = "首帧图片：公网 HTTP(S) URL，或 workspace 内的本地图片路径（jpg/jpeg/png/webp，≥300x300 像素，≤20MB；本地图片由脚本转 base64 上传）。"
required = true
flag = "--image"
must_exist = true

[[entrypoints.arguments]]
name = "prompt"
type = "string"
description = "可选的视频内容描述（主体的动作、镜头运动等），中文上限 2500 字符；省略时由模型自行发挥。"
flag = "--prompt"

[[entrypoints.arguments]]
name = "save"
type = "path"
description = "生成的视频保存路径（workspace 内相对路径）；脚本会把扩展名规范化为 .mp4。"
required = true
flag = "--save"

[[entrypoints.arguments]]
name = "resolution"
type = "enum"
values = ["480P", "720P", "1080P"]
description = "视频分辨率档位；省略时使用配置文件默认值。计费为 480P 0.45 元/秒、720P 0.9 元/秒、1080P 1.2 元/秒。"
flag = "--resolution"

[[entrypoints.arguments]]
name = "duration"
type = "integer"
minimum = 3
maximum = 15
description = "视频时长秒数，3-15；省略时使用配置文件默认值。"
flag = "--duration"

[[entrypoints.arguments]]
name = "watermark"
type = "boolean"
description = "传入 true 在视频右下角添加 \"Happy Horse\" 水印；省略时使用配置文件默认值（当前为不加）。"
flag = "--watermark"

[[entrypoints.arguments]]
name = "seed"
type = "integer"
minimum = 0
maximum = 2147483647
description = "随机种子；固定种子可提升多次生成的可复现性。省略时由服务端随机。"
flag = "--seed"
