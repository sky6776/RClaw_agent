# =============================================================================
# rclaw-runtime：编排层
# -----------------------------------------------------------------------------
# 把各能力组装成可运行的 agent：
#   - context_builder：拼装系统提示（前言 + SOUL/USER + 记忆 + daily + skills）
#   - AgentLoop：ReAct 工具调用循环（忠实实现全部正确性红线）
#   - CronService / Heartbeat：作为 inbound 生产者
#   - OutboundDispatcher：按 channel 名把回复路由回各通道
# 编排层。
# =============================================================================
[package]
name = "rclaw-runtime"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
rclaw-core = { workspace = true }
rclaw-store = { workspace = true }
rclaw-llm = { workspace = true }
rclaw-tools = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
rquickjs = { workspace = true }
chrono = { workspace = true }
sha2 = { workspace = true }     # rewind checkpoint 的文件内容 hash（持久化身份需跨 Rust 版本稳定）
rusqlite = { workspace = true }  # 工作流投影表与 journal 同库（workflow_store 直接用事务）
fs2 = "0.4"                      # 工作流 driver 单实例锁（跨进程）
globset = "0.4"                  # files.glob（项目根相对、拒绝越界）
walkdir = "2"                    # files.glob/grep 目录遍历
regex = "1"                      # files.grep / 代码扫描
serde_yaml = "0.9"               # 存档工作流元数据块（/* rclaw-workflow ... */）
rand = { workspace = true }      # 工作流 run / 请求 / 临时名
oxc_parser = "0.116.0"
oxc_allocator = "0.116.0"
oxc_ast = "0.116.0"
oxc_span = "0.116.0"
oxc_ast_visit = "0.116.0"

# rquickjs-sys 0.9 不内置 aarch64-linux-android 的预生成 bindings（查至最新 0.14 也没有，
# 报错「couldn't find file …/bindings/aarch64-linux-android.rs」）：安卓目标必须开 bindgen
# 特性在构建期现场生成——宿主需 libclang，交叉编译还需 BINDGEN_EXTRA_CLANG_ARGS 指向
# NDK sysroot（release.yml 的 termux/apk job 已配置）。非安卓目标不进本节，继续走内置
# bindings，不受影响。
[target.'cfg(target_os = "android")'.dependencies]
rquickjs = { workspace = true, features = ["bindgen"] }

# world.run 的进程树回收：Windows 用 Job Object（KILL_ON_JOB_CLOSE），Unix 用进程组。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Security",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
secrecy = { workspace = true }
