[package]
name = "rclaw-gbrain"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
description = "gbrain knowledge engine embedded directly in RClaw"

[dependencies]
rclaw-tools = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true, features = ["blocking", "multipart"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
calamine = { version = "0.26", features = ["picture"] }
csv = "1"
dirs = "6"
futures-util = "0.3"
hex = "0.4"
html2text = "0.13"
infer = "0.16"
jieba-rs = "0.7"
# PDF：与 rclaw-tools 的 read 工具同一引擎——pdf-inspector 负责加载/提取/OCR 路由信号，
# lopdf（pdf-inspector 的同版底层库）只用于字典级页几何统计、元数据读取和 OCR 拆分保存。
# 只用默认 features（纯 Rust）；绝不开 pdf-inspector 的 ocr feature——拉 PDFium/ONNX C 依赖。
lopdf = "0.42"
pdf-inspector = { workspace = true }
pinyin = "0.10"
pulldown-cmark = "0.12"
quick-xml = "0.37"
regex = "1"
rusqlite = { workspace = true }
serde_yaml = "0.9"
sha2 = "0.10"
sqlite-vec = "0.1"
thiserror = "2"
tracing-appender = "0.2"
tree-sitter = "0.24"
tree-sitter-c = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-go = "0.23"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-typescript = "0.23"
unicode-normalization = "0.1"
zip = "2"

[dev-dependencies]
tempfile = "3"
