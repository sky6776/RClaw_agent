# =============================================================================
# rclaw-store：持久化层（文件系统 + agent/state.sqlite）
# -----------------------------------------------------------------------------
# 负责：
#   - 初始化 agent 目录布局（agent/{config,memory,skills} + 关键文件）
#   - 原子写（tmp + rename，人读改的文件）
#   - state.sqlite：会话消息（事务级工具链追加、非破坏压缩 boundary、历史裁剪、
#     孤儿 tool_result 修复）、rewind 文件 checkpoint、usage 锚点、PlanRun /
#     WorkflowRun / 团队 journal 与 kv
#   - 长期记忆 / daily notes
#   - skills 摘要抽取
#   - cron.json 持久化
#   - 百分号编码的导出文件名（channel + chat_id）
# 依赖 rclaw-core 的消息模型。
# =============================================================================
[package]
name = "rclaw-store"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
rclaw-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
lunar-lite = { workspace = true }
percent-encoding = { workspace = true }
toml_edit = { workspace = true }
toml = { workspace = true }
rand = { workspace = true }
rusqlite = { workspace = true }   # agent/state.sqlite：会话 / checkpoint / 锚点 / journal

[dev-dependencies]
tempfile = "3"
